name: Frontend CI (gate leve)

# Gate leve do app mobile (Expo): typecheck + formatação.
# Sem testes — regra do projeto: não criar .spec.ts no frontend.
# QA funcional/visual permanece MANUAL (ver TESTING-PLAYBOOK.md) antes do eas build/submit.

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  frontend-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artos_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: artos_frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Checar formatação (prettier)
        run: npx prettier . --check
