appId: com.church.artos
---
# Escalas do ministério (visão admin/líder) — distinto de /pessoal/escalas (escalas.yaml).
- openLink: diakonia:///inicio
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: '6%,4%'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: 'Audiovisual'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: 'Escalas'
- waitForAnimationToEnd:
    timeout: 4000
