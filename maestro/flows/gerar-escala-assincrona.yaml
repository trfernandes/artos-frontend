appId: com.church.artos
---
# ═══════════════════════════════════════════════════════════════════
# Teste: Geração assíncrona de escala
#
# O que valida:
#   1. Wizard fecha no passo "Pronto" com botões "Ir ao início" / "Acompanhar"
#   2. "Acompanhar" navega para details.tsx mostrando o banner "Gerando..."
#   3. Polling detecta conclusão e o banner some (timeout 60s)
#
# Estrutura do drawer (MenuData.ts):
#   Pessoal: Inicio | Minhas Indisponibilidades | Minhas Escalas
#   Igreja (admin): Eventos | Ministérios→/admin/ministerios | Voluntários | Configurações
#   Ministérios: [nome do ministério, expansível] → Acessos | Agenda | Escalas | …
# ═══════════════════════════════════════════════════════════════════

# ── 1. Ponto de partida: tela inicial ────────────────────────────────────
- openLink: diakonia:///inicio
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Abrir drawer via ícone hambúrguer ─────────────────────────────────
- tapOn:
    point: '7%, 5%'
- waitForAnimationToEnd:
    timeout: 2000

# ── 3. Tocar em "Escalas" do Ministério de Louvor ────────────────────────
# Grupos "Kids" e "Ministério de Louvor" já vêm expandidos por padrão, ambos
# com item "Escalas" — index 1 é o do Ministério de Louvor (2º grupo)
- tapOn:
    text: 'Escalas'
    index: 1
- waitForAnimationToEnd:
    timeout: 4000

# ── 5. Verificar que estamos na lista de escalas e abrir o assistente (FAB)
- assertVisible:
    text: 'Escalas'

- tapOn:
    point: '90%, 87%'
- waitForAnimationToEnd:
    timeout: 2000

# FAB abre alerta "Nova escala" com 2 opções — escolher geração automática
- assertVisible:
    text: 'Nova escala'
- tapOn:
    text: 'Gerar automaticamente'
- waitForAnimationToEnd:
    timeout: 3000

# ── 6. Step 1 — Dados: preencher nome ───────────────────────────────────
- assertVisible:
    text: 'Como quer chamar essa escala?'

- tapOn:
    text: 'Como quer chamar essa escala?'
- inputText: 'Escala Async Maestro'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1000

# Avança sem alterar datas (usa defaults)
- tapOn:
    text: 'Próximo'
- waitForAnimationToEnd:
    timeout: 3000

# ── 7. Step 2 — Eventos: selecionar ao menos um ──────────────────────────
# Tenta selecionar todos se botão existir
- tapOn:
    text: 'Selecionar todos'
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: 'Próximo'
- waitForAnimationToEnd:
    timeout: 2000

# ── 8. Step 3 — Equipe: aceitar padrão ──────────────────────────────────
- tapOn:
    text: 'Próximo'
- waitForAnimationToEnd:
    timeout: 2000

# ── 9. Step 4 — Revisar e gerar ─────────────────────────────────────────
- tapOn:
    text: 'Gerar'
- extendedWaitUntil:
    visible: 'Geração iniciada!'
    timeout: 25000

# ── 10. Verificar passo "Pronto" com geração assíncrona ─────────────────
- assertVisible:
    text: 'Geração iniciada!'

- assertVisible:
    text: 'Acompanhar'

- assertVisible:
    text: 'Ir ao início'

# ── 11. Acompanhar → details.tsx ─────────────────────────────────────────
- tapOn:
    text: 'Acompanhar'
- waitForAnimationToEnd:
    timeout: 4000

# ── 12. Verificar banner "Gerando..." na tela de detalhes ────────────────
- assertVisible:
    text: 'Gerando itens da escala...'

# ── 13. Aguardar polling detectar conclusão (backend demora ~5-20s) ───────
- waitForAnimationToEnd:
    timeout: 60000

- assertNotVisible:
    text: 'Gerando itens da escala...'
