# Flow: Trocar plano — verificar que o modal de loading aparece
#
# Uso:
#   maestro test flows/billing-trocar-plano.yaml \
#     -e APP_EMAIL=admin@suaigreja.com \
#     -e APP_PASSWORD=SuaSenha123
#
# Pré-condição:
#   - Usuário ADMIN com assinatura ACTIVE (trial ou paga)
#   - Faturamento preenchido (CNPJ, telefone, endereço)
#   - Backend acessível (staging ou produção)
#
# O que verifica:
#   - Fluxo completo: aba → botão → modal de planos → selecionar plano → loading
#   - Modal de loading "Trocando de plano..." / "Preparando pagamento..." aparece
#     ao iniciar checkout (validação do fix do modal conflito com BottomSheet)
#   - Após fechar browser (Back), o app retorna sem crash
#
# NOTA: O pagamento em si é externo (browser Asaas) e não pode ser verificado
# pelo Maestro. Este flow verifica apenas a UI até a abertura do browser.

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

# Drawer → Configurações
- tapOn:
    point: "2%,50%"
- waitForAnimationToEnd
- tapOn: "Configurações"
- waitForAnimationToEnd:
    timeout: 5000

# Aba "Assinatura"
- tapOn: "Assinatura"
- waitForAnimationToEnd:
    timeout: 4000

# Aguardar status carregar
- assertTrue:
    condition: ${visible("Período avaliativo ativo") || visible("Assinatura em dia") || visible("Pagamento pendente")}
    label: "Status de assinatura não disponível para troca de plano"

# Abrir modal de planos
- tapOn:
    text: "Ver planos"
    optional: true
- tapOn:
    text: "Trocar plano"
    optional: true
- tapOn:
    text: "Atualizar plano"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Opções de Planos"

# Selecionar o plano Essencial (ajustar conforme plano disponível no ambiente)
- tapOn: "Essencial"
- waitForAnimationToEnd

# Tocar no botão de confirmar dentro do modal
# (rótulo varia: "Assinar Essencial", "Trocar para Essencial", etc.)
- tapOn:
    index: 0
    text: "Assinar"
    optional: true
- tapOn:
    index: 0
    text: "Trocar"
    optional: true

# O bottom sheet fecha (~350ms) e o modal de loading deve aparecer antes do browser abrir
- waitForAnimationToEnd:
    timeout: 1500

# Verificar que o loading modal apareceu
- assertTrue:
    condition: ${visible("Trocando de plano...") || visible("Preparando pagamento...")}
    label: "Modal de loading não apareceu ao iniciar checkout"

- takeScreenshot: billing-loading-modal

# O browser abre automaticamente em seguida — Maestro não pode interagir com ele.
# Aguardar retorno ao app (o usuário fecharia o browser manualmente em um teste real).
