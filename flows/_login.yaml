# Subflow: login
# Uso: - runFlow: _login.yaml
# Vars necessárias: APP_EMAIL, APP_PASSWORD
#
# Aguarda o app estabilizar (login screen OU home screen visível), depois
# faz login apenas se necessário.
appId: com.church.artos
---
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: "Entre na sua conta"
    file: _do_login.yaml
