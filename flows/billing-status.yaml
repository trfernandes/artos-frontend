# Flow: Verificar tela de Assinatura (billing status)
#
# Uso:
#   maestro test flows/billing-status.yaml \
#     -e APP_EMAIL=admin@suaigreja.com \
#     -e APP_PASSWORD=SuaSenha123
#
# Pré-condição: usuário deve ser ADMIN de uma igreja.
# O que verifica:
#   - Navegação até a aba "Assinatura" em Configurações
#   - Card de status visível (título e chip de status)
#   - Barras de uso (Voluntários, Ministérios) presentes
#   - Botão de ação primária (ex: "Ver planos", "Trocar plano") visível

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

# Abrir o drawer lateral
- tapOn:
    point: "2%,50%"
- waitForAnimationToEnd

# Navegar para Configurações
- tapOn: "Configurações"
- waitForAnimationToEnd:
    timeout: 5000

# Ir para a aba "Assinatura" (índice 3 no FancyTabs)
- tapOn: "Assinatura"
- waitForAnimationToEnd:
    timeout: 4000

# Verificar card de status: o título varia por estado, mas um destes deve estar visível
- assertTrue:
    condition: ${visible("Período avaliativo ativo") || visible("Assinatura em dia") || visible("Pagamento pendente") || visible("Acesso mantido até o fim do ciclo") || visible("Faixa gratuita")}
    label: "Card de status de assinatura não encontrado"

# Verificar barras de uso
- assertVisible: "Voluntários"
- assertVisible: "Ministérios"

# Verificar que o botão de ação primária está visível
- assertTrue:
    condition: ${visible("Ver planos") || visible("Trocar plano") || visible("Retomar pagamento") || visible("Assinar agora") || visible("Escolher plano") || visible("Atualizar plano") || visible("Reativar assinatura")}
    label: "Botão de ação primária de billing não encontrado"

- takeScreenshot: billing-status
