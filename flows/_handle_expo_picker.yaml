# Subflow: trata o server picker do Expo Dev Client
# Se "DEVELOPMENT SERVERS" estiver visível, toca no primeiro servidor disponível.
# Chamado logo após launchApp em todos os flows.

appId: com.church.artos
---
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://localhost:8081"
      - waitForAnimationToEnd:
          timeout: 8000
